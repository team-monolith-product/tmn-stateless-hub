name: Upload Package Dev

on:
  push:
    branches: [develop]

jobs:
  upload:
    uses: ./.github/workflows/upload-package.yml
    with:
      env: dev
      repository_url: https://nexus.dev.codle.io/repository/pypi-internal/
      dockerfile_branch: develop
    secrets:
      AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
      NEXUS_PYPI_MACHINE_PASSWORD: ${{ secrets.NEXUS_PYPI_MACHINE_PASSWORD_DEV }}
